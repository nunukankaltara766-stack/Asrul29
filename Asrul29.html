<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Ulang Tahun!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fedac2 0%, #edc3ca 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 450px;
            width: 90%;
            transition: all 0.5s ease;
            z-index: 10;
        }

        h1 {
            color: #d85a7fff;
            margin-bottom: 20px;
            font-size: 2rem;
        }

        p {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 20px;
            margin-bottom: 20px;
            border: 2px solid #edc3ca;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            text-align: center;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #d85a7f;
        }

        button {
            background: #d85a7f;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(216, 90, 127, 0.4);
            transition: transform 0.2s, background 0.3s;
        }

        button:hover {
            background: #c24d6e;
            transform: translateY(-2px);
        }

        .hidden {
            display: none;
        }

        /* Animasi Kue / Lilin sederhana */
        .cake {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Style untuk konfeti */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            opacity: 0.7;
            animation: fall 3s linear infinite;
            top: -10px;
            border-radius: 50%;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <!-- FORM INPUT NAMA -->
    <div id="form-card" class="card">
        <div class="cake">🎂</div>
        <h1>Halo!</h1>
        <p>Ada kejutan kecil untukmu hari ini. <br>Boleh tahu siapa namamu?</p>
        <input type="text" id="name-input" placeholder="Masukkan nama kamu di sini..." autocomplete="off">
        <button onclick="tampilkanUcapan()">Buka Kejutan ✨</button>
    </div>

    <!-- HALAMAN UCAPAN (Disembunyikan di awal) -->
    <div id="wish-card" class="card hidden">
        <div class="cake">🎉🥳</div>
        <h1>Selamat Ulang Tahun, <span id="user-name" style="color: #ff477e;">Nama</span>!</h1>
        <p>Hari ini adalah hari yang spesial untukmu. Semoga panjang umur, sehat selalu, dilimpahkan kebahagiaan, dan semua impianmu segera terwujud! 🎈✨</p>
        <button onclick="resetHalaman()">Ulangi</button>
    </div>

    <script>
        function tampilkanUcapan() {
            const nameInput = document.getElementById('name-input').value.trim();
            
            // Validasi jika input nama kosong
            if (nameInput === "") {
                alert("Silakan masukkan namamu terlebih dahulu ya!");
                return;
            }

            // Memasukkan nama ke dalam teks ucapan
            document.getElementById('user-name').innerText = nameInput;

            // Tukar tampilan kartu
            document.getElementById('form-card').classList.add('hidden');
            document.getElementById('wish-card').classList.remove('hidden');

            // Jalankan efek konfeti
            buatKonfeti();
        }

        function resetHalaman() {
            // Hapus efek konfeti yang ada
            const confettis = document.querySelectorAll('.confetti');
            confettis.forEach(c => c.remove());

            // Reset input dan balikkan tampilan
            document.getElementById('name-input').value = "";
            document.getElementById('wish-card').classList.add('hidden');
            document.getElementById('form-card').classList.remove('hidden');
        }

        // Fungsi membuat animasi kertas warna-warni jatuh
        function buatKonfeti() {
            const warna = ['#ff477e', '#ff7096', '#ff85a1', '#fbb1bd', '#f9bec7', '#3a86ff', '#ffbe0b', '#fb5607'];
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                // Mengatur posisi, warna, dan kecepatan acak untuk tiap kertas
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = warna[Math.floor(Math.random() * warna.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's'; // antara 2 - 4 detik
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.width = Math.random() * 8 + 6 + 'px';
                confetti.style.height = confetti.style.width;

                document.body.appendChild(confetti);
            }
        }
    </script>
</body>
</html>
